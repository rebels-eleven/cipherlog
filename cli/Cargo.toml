[package]
name = "cipherlog-cli"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Reference CLI and Rust implementation of the cipherlog-v1 encrypted log format"
repository = "https://github.com/rebels-eleven/cipherlog"
homepage = "https://rebels11.com"
authors = ["rebels11 <hello@rebels11.com>"]
publish = false

[[bin]]
name = "cipherlog"
path = "src/main.rs"

[lib]
name = "cipherlog"
path = "src/lib.rs"

[dependencies]
hpke = { version = "0.15.2", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zeroize = "1"
getrandom = "0.4"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
