# Coordinates of both published artifacts (com.rebels11:cipherlog-core, com.rebels11:cipherlog). VERSION_NAME is the
# single source of the version: the device block prints it from a generated constant.
GROUP=com.rebels11
VERSION_NAME=0.1.0-alpha.1

POM_URL=https://github.com/rebels-eleven/cipherlog
POM_SCM_URL=https://github.com/rebels-eleven/cipherlog
POM_SCM_CONNECTION=scm:git:https://github.com/rebels-eleven/cipherlog.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rebels-eleven/cipherlog.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=rebels11
POM_DEVELOPER_NAME=rebels11
POM_DEVELOPER_EMAIL=hello@rebels11.com
POM_DEVELOPER_URL=https://rebels11.com

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# No Kotlin in this build: AGP 9 would otherwise add kotlin-stdlib to every Android module (and to the AAR POM). Tink's
# androidx.annotation dependency, which brings kotlin-stdlib 1.7.10, is excluded in cipherlog-core/build.gradle.kts.
kotlin.stdlib.default.dependency=false
