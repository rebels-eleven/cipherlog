name: CipherLogExample
options:
  bundleIdPrefix: com.rebels11.cipherlog
  deploymentTarget:
    iOS: "17.0"
packages:
  CipherLog:
    path: ../..
targets:
  CipherLogExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: CipherLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebels11.cipherlog.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CipherLog
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
